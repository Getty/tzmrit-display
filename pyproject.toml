[project]
name = "tzmrit-display"
dynamic = ["version"]
description = "Linux system monitor for HONGTAI USB LCD panels (33c3:7791/7792)"
authors = [{name = "Torsten Raudssus", email = "torsten@raudssus.de"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["usb", "lcd", "system-monitor", "hongtai", "tzmrit", "cdc-acm", "claude-code"]
dependencies = ["pyserial>=3.5", "pillow>=10.0", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/Getty/tzmrit-display"
Issues = "https://github.com/Getty/tzmrit-display/issues"

[project.scripts]
tzmrit-display = "tzmrit_display.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tzmrit_display"]

# The version has no home in the repo - it is derived from the git tag
# (v0.2.0 -> 0.2.0; between releases: 0.2.1.dev3+g<hash>). Releasing is
# creating the tag, nothing more. fallback_version covers tarball checkouts
# without git history.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
