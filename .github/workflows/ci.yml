name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # The Linux side is described by the job filenames in .cicd/ and runs through
  # SimpiCI, so there is nothing about it to configure here.
  simpici:
    permissions:
      contents: read
      packages: write
    uses: Getty/simpici/.github/workflows/simpici.yml@main

  # Windows stays on Actions: SimpiCI runs every job in a Linux container, so
  # neither this test run nor the NSIS installer below can move into .cicd/
  # yet. Tracked as simpici#6.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  installer:
    runs-on: windows-latest
    needs: [simpici, test-windows]
    permissions:
      contents: write  # upload the release asset on tag builds
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # NSIS is no longer preinstalled on the runner image, so it is fetched
      # here. Chocolatey answers 504 often enough to have broken a build, and
      # it reports success when it installed nothing at all - hence the retry
      # and the check that the executable actually exists. Without that check
      # the failure surfaces four minutes later, inside build.bat, as a
      # missing-NSIS message that reads like a local setup mistake.
      - name: Ensure NSIS
        shell: pwsh
        run: |
          # Both locations, in the order build.bat looks in them - checking
          # only one would reinstall and then fail over an NSIS the build
          # itself would have found.
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          )
          $makensis = $null
          foreach ($attempt in 1..3) {
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($makensis) { break }
            if ($attempt -gt 1) { Start-Sleep -Seconds (15 * $attempt) }
            Write-Host "Installing NSIS (attempt $attempt)"
            choco install nsis -y --no-progress
          }
          if (-not $makensis) {
            throw "NSIS still missing after three attempts; looked in: $($candidates -join ', ')"
          }
          & $makensis /VERSION

      - name: Build installer
        shell: cmd
        run: packaging\build.bat

      - uses: actions/upload-artifact@v6
        with:
          name: tzmrit-display-setup
          path: packaging/tzmrit-display-setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/tzmrit-display-setup-*.exe
