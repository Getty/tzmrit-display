name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  installer:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write  # upload the release asset on tag builds
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: Build installer
        shell: cmd
        run: packaging\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: display-panel-setup
          path: packaging/display-panel-setup-*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/display-panel-setup-*.exe
